<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Voice Appointment Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-active: #0284c7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 9999px;
            background-color: rgba(255, 255, 255, 0.05);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .status-dot.active {
            background-color: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        .status-dot.speaking {
            background-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
        }

        .call-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background-color: var(--accent-color);
            color: #000;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.4);
        }

        .call-btn:hover {
            transform: scale(1.05);
            background-color: var(--accent-active);
            color: #fff;
        }

        .call-btn.active {
            background-color: var(--danger-color);
            color: #fff;
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.4);
        }

        .hint {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voice Appointment Assistant</h1>
        <p class="subtitle">Real-time voice assistant with instant barge-in support</p>

        <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Disconnected</span>
        </div>

        <div>
            <button class="call-btn" id="callBtn">Call</button>
        </div>

        <p class="hint">Click "Call" to start speaking. Speak anytime to interrupt (barge-in).</p>
    </div>

    <script>
        let ws = null;
        let audioCtx = null;
        let micStream = null;
        let scriptProcessor = null;
        let isCalling = false;
        let scheduledAudioSources = [];
        let nextPlayTime = 0;

        const callBtn = document.getElementById('callBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        function updateStatus(text, state) {
            statusText.textContent = text;
            statusDot.className = 'status-dot';
            if (state === 'active') statusDot.classList.add('active');
            if (state === 'speaking') statusDot.classList.add('speaking');
        }

        function stopAllAudio() {
            scheduledAudioSources.forEach(source => {
                try {
                    source.stop();
                } catch (e) {}
            });
            scheduledAudioSources = [];
            nextPlayTime = 0;
        }

        async function startCall() {
            try {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws`;
                ws = new WebSocket(wsUrl);
                ws.binaryType = 'arraybuffer';

                ws.onopen = async () => {
                    updateStatus('Connected - Listening', 'active');
                    callBtn.textContent = 'End';
                    callBtn.classList.add('active');
                    isCalling = true;
                    await initMic();
                };

                ws.onmessage = (event) => {
                    if (typeof event.data === 'string') {
                        try {
                            const msg = JSON.parse(event.data);
                            if (msg.type === 'interruption') {
                                console.log('[Barge-in] Interruption received, clearing audio queue.');
                                stopAllAudio();
                                updateStatus('Interrupted - Listening', 'active');
                            }
                        } catch (e) {}
                    } else if (event.data instanceof ArrayBuffer) {
                        playAudioChunk(event.data);
                    }
                };

                ws.onclose = () => {
                    endCall();
                };

                ws.onerror = (err) => {
                    console.error('WebSocket error:', err);
                    endCall();
                };
            } catch (err) {
                console.error('Start call error:', err);
                endCall();
            }
        }

        function endCall() {
            isCalling = false;
            stopAllAudio();

            if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
                micStream = null;
            }
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
            if (ws) {
                ws.close();
                ws = null;
            }

            callBtn.textContent = 'Call';
            callBtn.classList.remove('active');
            updateStatus('Disconnected', 'idle');
        }

        async function initMic() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
            const source = audioCtx.createMediaStreamSource(micStream);

            // 4096 samples at 16kHz ≈ 256ms per buffer
            scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
            source.connect(scriptProcessor);
            scriptProcessor.connect(audioCtx.destination);

            scriptProcessor.onaudioprocess = (e) => {
                if (!isCalling || !ws || ws.readyState !== WebSocket.OPEN) return;
                const inputData = e.inputBuffer.getChannelData(0);
                // Convert Float32Array to 16-bit PCM Int16Array
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    const s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                ws.send(pcm16.buffer);
            };
        }

        function playAudioChunk(arrayBuffer) {
            if (!audioCtx) return;
            updateStatus('Assistant Speaking', 'speaking');
            
            // Output audio from Piper TTS is 22050 Hz 16-bit PCM mono
            const pcm16 = new Int16Array(arrayBuffer);
            const float32 = new Float32Array(pcm16.length);
            for (let i = 0; i < pcm16.length; i++) {
                float32[i] = pcm16[i] / 32768.0;
            }

            const buffer = audioCtx.createBuffer(1, float32.length, 22050);
            buffer.getChannelData(0).set(float32);

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);

            const currentTime = audioCtx.currentTime;
            if (nextPlayTime < currentTime) {
                nextPlayTime = currentTime;
            }

            source.start(nextPlayTime);
            nextPlayTime += buffer.duration;
            scheduledAudioSources.push(source);

            source.onended = () => {
                const index = scheduledAudioSources.indexOf(source);
                if (index > -1) scheduledAudioSources.splice(index, 1);
                if (scheduledAudioSources.length === 0 && isCalling) {
                    updateStatus('Connected - Listening', 'active');
                }
            };
        }

        callBtn.addEventListener('click', () => {
            if (isCalling) {
                endCall();
            } else {
                startCall();
            }
        });
    </script>
</body>
</html>
