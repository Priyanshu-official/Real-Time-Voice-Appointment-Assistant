services:
  postgres:
    image: postgres:16
    container_name: clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

# Ollama is NOT containerized (see ADR-003 / ADR-006).
# Docker Desktop on Mac does not pass through Metal GPU acceleration,
# so Ollama must run natively on the host for real inference speed.
# The app connects to it via http://host.docker.internal:11434 (see .env.example).

volumes:
  pgdata:
