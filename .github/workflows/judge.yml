name: judge

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        volumes:
          - ${{ github.workspace }}/app/db/init:/docker-entrypoint-initdb.d
        options: >-
          --health-cmd "pg_isready -U clinic_app -d clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clinic_app:ci_test_password@localhost:5432/clinic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Wait for Postgres init scripts to apply
        run: |
          until docker exec $(docker ps -qf "ancestor=postgres:16") \
            psql -U clinic_app -d clinic -c "\d appointments" > /dev/null 2>&1; do
            echo "waiting for schema..."
            sleep 2
          done

      - name: Run tests
        run: uv run pytest -v
