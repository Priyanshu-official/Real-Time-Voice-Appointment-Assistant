name: judge

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_app -d clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clinic_app:ci_test_password@localhost:5432/clinic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Initialize database schema
        run: |
          docker exec -i $(docker ps -qf "ancestor=postgres:16") psql -U clinic_app -d clinic < app/db/init/01-extensions.sql
          docker exec -i $(docker ps -qf "ancestor=postgres:16") psql -U clinic_app -d clinic < app/db/init/02-schema.sql

      - name: Run tests
        run: uv run pytest -v
